[project]
name = "invisible-classroom-backend"
version = "0.1.0"
description = "The Invisible Classroom backend (FastAPI modular monolith)"
requires-python = ">=3.11"
dependencies = [
    "boto3==1.43.125",
    "fastapi==0.162.0",
    "opentelemetry-api==1.45.2",
    "opentelemetry-sdk==1.45.2",
    "pydantic==2.14.2",
    "pydantic-settings==2.16.2",
    "strands-agents==1.64.0",
]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
files = ["app", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[dependency-groups]
dev = [
    "cyclonedx-bom==8.0.1",
    "httpx==0.28.1",
    "hypothesis==6.170.14",
    "mypy==2.4.1",
    "pip-audit==2.10.1",
    "pytest==9.2.0",
    "pytest-asyncio==1.4.1.post1",
    "ruff==0.17.3",
]

[[tool.mypy.overrides]]
module = ["boto3", "boto3.*", "botocore", "botocore.*"]
ignore_missing_imports = true
